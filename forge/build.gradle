plugins {
    id("dev.kikugie.stonecutter") version "0.9"
    alias(libs.plugins.forge.moddev)
}
apply from: rootProject.file('buildscript/loader.gradle')

var minecraftVersion = sc.current.version.toString().split("-")[0]
var stonecutterNode = rootProject.findProject("modded").subprojects.find { it.name == project.name }

configurations.configureEach {
    resolutionStrategy {
        force "org.apache.logging.log4j:log4j-api:2.19.0" // Introduced by Forge itself
        force "org.apache.logging.log4j:log4j-core:2.19.0" // Introduced by Forge itself
    }
}

java {
    var java = stonecutterNode.java.targetCompatibility

    toolchain.languageVersion = JavaLanguageVersion.of(java.getMajorVersion())
    targetCompatibility = java
    sourceCompatibility = java
}

sourceSets {
    main {
        java {
            srcDirs("versions/${sc.current.version}/src/main/java", stonecutterNode.file("src/main/java").path)
        }
        resources {
            srcDirs("versions/${sc.current.version}/src/main/resources")
        }
    }
}

processResources {
    var replaceProperties = [
            mod_id:       "discordsrv",
            mod_name:     "DiscordSRV",
            mod_license:  "GPLv3",
            mod_version:  version,

            minecraft_version: minecraftVersion,
            minecraft_version_range: stonecutterNode.property("minecraft.version_range"),

            forge_version: stonecutterNode.property("deps.forge_version")
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/forge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.register('copyForge', Copy) {
    from this.shadowJar
    into rootProject.file("jars/forge")
}

shadowJar {
    dependsOn stonecutterNode.shadowJar

    configurations = [project.configurations.shadow]
    mergeServiceFiles()

    relocate('com.discordsrv.unrelocate.', '')

    from stonecutterNode.tasks.shadowJar.archiveFile
    from(rootProject.project("common").sourceSets.main.output) {
        include "com/discordsrv/common/permission/game/**"
    }
    from(stonecutterNode.sourceSets.main.output) {
        include "com/discordsrv/modded/util/**"
        include "com/discordsrv/modded/mixin/**"
        include "com/discordsrv/modded/accessor/**"
        include "discordsrv.mixins.json"
    }

    archiveBaseName = "DiscordSRV-Forge-${stonecutterNode.property('minecraft.version_range_label')}"
    archiveClassifier = project.parent.jar.archiveClassifier

    finalizedBy copyForge
}

spotless {
    java {
        target("src/main/java")
    }
}

artifacts {
    shadow shadowJar
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net/'}
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = "https://maven.parchmentmc.org" }
}

legacyForge {
    version = minecraftVersion + "-" + stonecutterNode.property("deps.forge_version")
}

dependencies {
    // Mixin Extras
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.4"))

    // Adventure
    runtimeDownload(libs.adventure.api)

    // DependencyDownload
    shadow(libs.dependencydownload.jarinjar.loader)
    shadow(libs.dependencydownload.jarinjar.bootstrap)
}
